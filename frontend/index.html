<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Omnix — 3-Tier Task Tracker</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --ok: #22c55e;
      --bad: #ef4444;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f8fafc;
        --card: #ffffff;
        --border: #cbd5e1;
        --text: #0f172a;
        --muted: #64748b;
        --accent: #0284c7;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 2rem 1rem;
    }
    main {
      max-width: 600px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }
    h1 { margin: 0; font-size: 1.35rem; }
    .badge {
      font-size: 0.8rem;
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .badge.ok { color: var(--ok); border-color: var(--ok); }
    .badge.bad { color: var(--bad); border-color: var(--bad); }
    form {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    input[type="text"] {
      flex: 1;
      padding: 0.6rem 0.75rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: transparent;
      color: inherit;
      font-size: 0.95rem;
    }
    button {
      padding: 0.6rem 0.95rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    button.ghost {
      background: transparent;
      color: var(--muted);
      padding: 0.3rem 0.55rem;
      font-size: 0.8rem;
    }
    button.ghost:hover { color: var(--bad); border-color: var(--bad); }
    #error {
      color: var(--bad);
      font-size: 0.88rem;
      min-height: 1.2em;
      margin: 0 0 0.75rem;
    }
    ul { list-style: none; padding: 0; margin: 0; }
    li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.65rem 0;
      border-top: 1px solid var(--border);
    }
    label.item-label {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex: 1;
      cursor: pointer;
      word-break: break-word;
    }
    .done { text-decoration: line-through; color: var(--muted); }
    .empty { color: var(--muted); font-size: 0.9rem; text-align: center; padding: 1.25rem 0; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Omnix Tasks</h1>
      <span id="health" class="badge" aria-live="polite">DB: checking...</span>
    </header>

    <form id="add-form">
      <input id="title-input" type="text" maxlength="200" placeholder="Add a task..." aria-label="Task title" required>
      <button id="add-btn" type="submit">Add</button>
    </form>

    <p id="error" role="alert"></p>
    <ul id="items"></ul>
  </main>

  <script>
    const API_BASE =
      location.protocol === 'file:' ||
      (['localhost', '127.0.0.1'].includes(location.hostname) && location.port !== '3000')
        ? 'http://localhost:3000'
        : '';

    const healthEl = document.getElementById('health');
    const errorEl = document.getElementById('error');
    const itemsEl = document.getElementById('items');
    const formEl = document.getElementById('add-form');
    const inputEl = document.getElementById('title-input');
    const addBtn = document.getElementById('add-btn');

    async function api(path, options = {}) {
      const res = await fetch(`${API_BASE}${path}`, {
        headers: options.body ? { 'Content-Type': 'application/json' } : {},
        ...options,
      });
      if (res.status === 204) return null;
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
      return data;
    }

    async function checkHealth() {
      try {
        const data = await api('/api/health');
        healthEl.textContent = `DB: ${data.db}`;
        healthEl.className = 'badge ok';
      } catch {
        healthEl.textContent = 'DB: disconnected';
        healthEl.className = 'badge bad';
      }
    }

    function renderItems(items) {
      itemsEl.replaceChildren();
      if (!items.length) {
        const empty = document.createElement('li');
        empty.className = 'empty';
        empty.textContent = 'No tasks yet. Add one above.';
        itemsEl.appendChild(empty);
        return;
      }
      for (const item of items) {
        const li = document.createElement('li');
        const label = document.createElement('label');
        label.className = 'item-label';

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = Boolean(item.done);
        checkbox.addEventListener('change', () => toggleItem(item.id, checkbox.checked));

        const span = document.createElement('span');
        span.textContent = item.title;
        if (item.done) span.className = 'done';

        const delBtn = document.createElement('button');
        delBtn.type = 'button';
        delBtn.className = 'ghost';
        delBtn.textContent = 'Delete';
        delBtn.addEventListener('click', () => deleteItem(item.id));

        label.append(checkbox, span);
        li.append(label, delBtn);
        itemsEl.appendChild(li);
      }
    }

    async function loadItems() {
      errorEl.textContent = '';
      try {
        const { items } = await api('/api/items');
        renderItems(items);
      } catch (err) {
        errorEl.textContent = err.message;
      }
    }

    async function toggleItem(id, done) {
      errorEl.textContent = '';
      try {
        await api(`/api/items/${id}`, {
          method: 'PATCH',
          body: JSON.stringify({ done }),
        });
        await loadItems();
      } catch (err) {
        errorEl.textContent = err.message;
        await loadItems();
      }
    }

    async function deleteItem(id) {
      errorEl.textContent = '';
      try {
        await api(`/api/items/${id}`, { method: 'DELETE' });
        await loadItems();
      } catch (err) {
        errorEl.textContent = err.message;
      }
    }

    formEl.addEventListener('submit', async (event) => {
      event.preventDefault();
      const title = inputEl.value.trim();
      if (!title) return;
      errorEl.textContent = '';
      addBtn.disabled = true;
      try {
        await api('/api/items', {
          method: 'POST',
          body: JSON.stringify({ title }),
        });
        inputEl.value = '';
        await loadItems();
      } catch (err) {
        errorEl.textContent = err.message;
      } finally {
        addBtn.disabled = false;
      }
    });

    checkHealth();
    loadItems();
  </script>
</body>
</html>
