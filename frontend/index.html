<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Omnix Tasks</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #0284c7;
      --ok: #22c55e;
      --bad: #ef4444;
    }
    @media (prefers-color-scheme: light) {
      :root { --bg: #f8fafc; --card: #fff; --border: #cbd5e1; --text: #0f172a; --muted: #64748b; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 2rem 1rem; }
    main { max-width: 580px; margin: 0 auto; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 1.5rem; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 1.25rem; }
    h1 { margin: 0; font-size: 1.3rem; }
    .badge { font-size: 0.8rem; padding: 0.2rem 0.6rem; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
    .badge.ok { color: var(--ok); border-color: var(--ok); }
    .badge.bad { color: var(--bad); border-color: var(--bad); }
    form { display: flex; gap: 0.5rem; margin-bottom: 0.75rem; }
    input, button { font: inherit; }
    input[type="text"] { flex: 1; padding: 0.55rem 0.75rem; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: inherit; }
    button { padding: 0.55rem 0.9rem; border-radius: 6px; border: 1px solid var(--border); background: var(--accent); color: #fff; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    button.del { background: transparent; color: var(--muted); padding: 0.25rem 0.55rem; font-size: 0.8rem; }
    button.del:hover { color: var(--bad); border-color: var(--bad); }
    #error { color: var(--bad); font-size: 0.85rem; min-height: 1.1em; margin: 0 0 0.6rem; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; padding: 0.6rem 0; border-top: 1px solid var(--border); }
    label { display: flex; align-items: center; gap: 0.6rem; flex: 1; cursor: pointer; word-break: break-word; }
    .done { text-decoration: line-through; color: var(--muted); }
    .empty { color: var(--muted); font-size: 0.9rem; justify-content: center; padding: 1.2rem 0; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Omnix Tasks</h1>
      <span id="health" class="badge" aria-live="polite">DB: checking...</span>
    </header>
    <form id="add-form">
      <input id="title" type="text" maxlength="200" placeholder="Add a task..." aria-label="Task title" required>
      <button id="add-btn" type="submit">Add</button>
    </form>
    <p id="error" role="alert"></p>
    <ul id="items"></ul>
  </main>

  <script>
    const healthEl = document.getElementById('health');
    const errorEl = document.getElementById('error');
    const itemsEl = document.getElementById('items');
    const formEl = document.getElementById('add-form');
    const inputEl = document.getElementById('title');
    const addBtn = document.getElementById('add-btn');

    async function api(path, options = {}) {
      const res = await fetch(path, {
        headers: options.body ? { 'Content-Type': 'application/json' } : {},
        ...options,
      });
      if (res.status === 204) return null;
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
      return data;
    }

    async function checkHealth() {
      try {
        const { db } = await api('/api/health');
        healthEl.textContent = `DB: ${db}`;
        healthEl.className = 'badge ok';
      } catch {
        healthEl.textContent = 'DB: disconnected';
        healthEl.className = 'badge bad';
      }
    }

    function renderItems(items) {
      itemsEl.replaceChildren();
      if (!items.length) {
        const empty = document.createElement('li');
        empty.className = 'empty';
        empty.textContent = 'No tasks yet.';
        itemsEl.appendChild(empty);
        return;
      }
      for (const item of items) {
        const li = document.createElement('li');
        const label = document.createElement('label');
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = Boolean(item.done);
        cb.addEventListener('change', () => mutate(`/api/items/${item.id}`, 'PATCH', { done: cb.checked }));

        const span = document.createElement('span');
        span.textContent = item.title;
        if (item.done) span.className = 'done';

        const del = document.createElement('button');
        del.type = 'button';
        del.className = 'del';
        del.textContent = 'Delete';
        del.addEventListener('click', () => mutate(`/api/items/${item.id}`, 'DELETE'));

        label.append(cb, span);
        li.append(label, del);
        itemsEl.appendChild(li);
      }
    }

    async function loadItems() {
      errorEl.textContent = '';
      try {
        const { items } = await api('/api/items');
        renderItems(items);
      } catch (err) {
        errorEl.textContent = err.message;
      }
    }

    async function mutate(path, method, body) {
      errorEl.textContent = '';
      try {
        await api(path, { method, body: body ? JSON.stringify(body) : undefined });
      } catch (err) {
        errorEl.textContent = err.message;
      }
      await loadItems();
    }

    formEl.addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = inputEl.value.trim();
      if (!title) return;
      addBtn.disabled = true;
      await mutate('/api/items', 'POST', { title });
      inputEl.value = '';
      addBtn.disabled = false;
    });

    checkHealth();
    loadItems();
  </script>
</body>
</html>
